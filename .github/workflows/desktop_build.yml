name: Build Linux Desktop (.deb & AppImage)

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'lyrics/**'
      - 'database/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/desktop_build.yml'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-desktop:
    name: Build Linux Desktop Packages (.deb & .AppImage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Linux Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev libasound2-dev libopenal-dev libgl1-mesa-dev libx11-dev libxext-dev libxrender-dev libxtst-dev libxi-dev fuse

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build .deb and .AppImage Packages
        run: |
          ./gradlew :desktop:app:packageDeb :desktop:app:packageAppImage -PYUMA_DESKTOP_ONLY=true --stacktrace

      - name: Find and Organize Generated Packages
        run: |
          mkdir -p dist/
          find desktop/app/build/compose/binaries/main/ -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YumaPlayer-Linux-Packages
          path: dist/*
          retention-days: 7
