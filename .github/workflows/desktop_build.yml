name: Build Linux Desktop (.deb & AppImage)

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'lyrics/**'
      - 'database/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/desktop_build.yml'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-desktop:
    name: Build Linux Desktop Packages (.deb & .AppImage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Linux Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev libasound2-dev libopenal-dev libgl1-mesa-dev libx11-dev libxext-dev libxrender-dev libxtst-dev libxi-dev wget file mpv
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build .deb and Distributable
        run: |
          ./gradlew :desktop:app:packageDeb :desktop:app:createDistributable -PYUMA_DESKTOP_ONLY=true --stacktrace

      - name: Build AppImage and Organize Packages
        run: |
          mkdir -p dist/
          find desktop/app/build/compose/binaries/main/deb/ -type f -name "*.deb" -exec cp {} dist/ \;

          APPDIR="/tmp/YumaPlayerAppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr"
          cp -r desktop/app/build/compose/binaries/main/app/YumaPlayer/* "$APPDIR/usr/"

          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/YumaPlayer" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          printf '[Desktop Entry]\nType=Application\nName=YumaPlayer\nExec=YumaPlayer\nIcon=icon\nComment=YumaPlayer - Music Player for Linux Mint\nCategories=AudioVideo;Audio;Player;\nTerminal=false\n' > "$APPDIR/YumaPlayer.desktop"

          cp desktop/app/src/main/resources/icon.png "$APPDIR/icon.png"
          cp desktop/app/src/main/resources/icon.png "$APPDIR/.DirIcon"

          ARCH=x86_64 /usr/local/bin/appimagetool --appimage-extract-and-run "$APPDIR" "dist/YumaPlayer-1.0.0-x86_64.AppImage"
          ls -la dist/

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YumaPlayer-Linux-Packages
          path: dist/*
          retention-days: 7
